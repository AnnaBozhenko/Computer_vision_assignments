<html>
<head>
    <title>Image Operation</title>
</head>
<body>

<h2>Operation: {{ op }}</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- Common input -->
    <label>Upload image:</label>
    <input type="file" name="image" required><br><br>

    {% if op == "canny" %}
        <label>Sigma:</label>
        <input type="number" step="0.1" name="sigma" required><br>

        <label>Low threshold:</label>
        <input type="number" step="0.1" name="low_threshold" required><br>

        <label>High threshold:</label>
        <input type="number" step="0.1" name="high_threshold" required><br>

    {% elif op == "median" %}
        <label>Kernel size:</label>
        <input type="number" name="kernel_size" required><br>

    {% elif op == "morphology" %}
        <label>Kernel size:</label>
        <input type="number" name="kernel_size" required><br>

        <label>Dilation:</label>
        <input type="checkbox" name="dilation"><br>

    {% elif op == "watermark_embed" %}
        <label>Watermark image:</label>
        <input type="file" name="watermark" required><br>

        <label>Level:</label>
        <input type="number" name="level" required><br>

    {% elif op == "watermark_extract" %}
        <label>Level:</label>
        <input type="number" name="level" required><br>
    {% endif %}

    <br>
    <button type="submit">Apply</button>
</form>

</body>
</html>
